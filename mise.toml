[tools]
rust = "1.92"
bun = "1.3"
"npm:tui-devtools" = "0.1"
"cargo:dotagents" = "0.1.1"

[settings.npm]
package_manager = "bun"

# ── Tasks ────────────────────────────────────────────────────────────────────

[tasks.dev]
description = "Run the development server"
run = "cargo run -- "

[tasks.build]
description = "Compile a debug build"
run = "cargo build"

[tasks."build:release"]
description = "Compile an optimised release build"
run = "cargo build --release"

[tasks."check:ts:fmt"]
description = "Format e2e TypeScript (biome format)"
run = "cd tests/e2e && bunx biome format --write ."

[tasks."check:ts:lint"]
description = "Lint e2e TypeScript (biome lint)"
run = "cd tests/e2e && bunx biome lint ."

[tasks."check:ts"]
description = "Format and lint e2e TypeScript (biome check)"
run = "cd tests/e2e && bunx biome check --write ."

[tasks."check:rust:fmt"]
description = "Format Rust source (rustfmt)"
run = "cargo fmt"

[tasks."check:rust:lint"]
description = "Lint Rust source (clippy)"
run = "cargo clippy"

[tasks."check:rust"]
description = "Format and lint Rust source (rustfmt + clippy)"
depends = ["check:rust:fmt", "check:rust:lint"]

[tasks."check:fmt"]
description = "Format Rust source (rustfmt) and e2e TypeScript (biome format)"
depends = ["check:rust:fmt", "check:ts:fmt"]

[tasks."check:lint"]
description = "Lint Rust source (clippy) and e2e TypeScript (biome lint)"
depends = ["check:rust:lint", "check:ts:lint"]

[tasks.check]
description = "Format then lint"
depends = ["check:fmt", "check:lint"]

[tasks."tests:unit"]
description = "Run all unit tests"
run = "cargo test --bin dotagents"

[tasks."tests:integration"]
description = "Run the integration test suite"
run = "cargo test --test integration"

[tasks."tests:e2e"]
description = "Run the full end-to-end test suite (tests/e2e/) via tui-test"
depends = ["build:release"]
run = "cd tests/e2e && bunx tui-test"

[tasks.tests]
description = "Run every test: unit + integration + e2e"
depends = ["tests:unit", "tests:integration", "tests:e2e"]
