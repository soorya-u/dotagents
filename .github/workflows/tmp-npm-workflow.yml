name: Tmp npm publish test

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish e.g. 0.0.0-nightly"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install musl toolchain
        run: sudo apt-get install -y musl-tools

      - name: Build binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Clear .npmrc
        run: rm -f "$NPM_CONFIG_USERCONFIG" ~/.npmrc

      - name: Create package
        run: |
          mkdir -p ./pkg
          cp target/x86_64-unknown-linux-musl/release/dotagents ./pkg/dotagents-linux-x64-musl
          chmod +x ./pkg/dotagents-linux-x64-musl
          cat > ./pkg/package.json <<EOF
          {
            "name": "@soorya-u/dotagents-linux-x64",
            "version": "${{ inputs.version }}",
            "description": "Platform-specific binary for dotagents (linux-x64)",
            "os": ["linux"],
            "cpu": ["x64"],
            "main": "dotagents-linux-x64-musl",
            "files": ["dotagents-linux-x64-musl"]
          }
          EOF

      - name: Debug info
        run: |
          echo "=== npm version ==="
          npm --version
          echo "=== node version ==="
          node --version
          echo "=== .npmrc ==="
          cat "$NPM_CONFIG_USERCONFIG" 2>/dev/null || echo "no NPM_CONFIG_USERCONFIG"
          cat ~/.npmrc 2>/dev/null || echo "no ~/.npmrc"
          echo "=== NODE_AUTH_TOKEN set? ==="
          if [ -z "${NODE_AUTH_TOKEN}" ]; then echo "NOT SET"; else echo "SET (length: ${#NODE_AUTH_TOKEN})"; fi

      - name: Publish
        run: |
          cd ./pkg
          npm publish --access public --provenance --tag nightly
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
