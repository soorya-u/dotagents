name: Release Prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release e.g. 0.2.0"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"

      - uses: Swatinem/rust-cache@v2

      - name: Bump version in Cargo.toml
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"${{ inputs.version }}\"/" Cargo.toml
          cargo update --workspace

      - name: Create release PR
        uses: peter-evans/create-pull-request@v6
        with:
          title: "chore: release v${{ inputs.version }}"
          branch: bot/release-v${{ inputs.version }}
          commit-message: "chore: release v${{ inputs.version }}"
          body: |
            ## Release v${{ inputs.version }}

            This PR was automatically created by the release-prep workflow.

            ### Changes
            - Bumped version in `Cargo.toml` to `${{ inputs.version }}`

            ### After merging
            An annotated tag `v${{ inputs.version }}` will be created automatically, triggering the full release pipeline.
          add-paths: |
            Cargo.toml
            Cargo.lock
