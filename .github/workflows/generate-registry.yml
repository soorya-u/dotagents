name: Generate Provider Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public/v1/templates/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-registry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Detect Changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — forcing changes_detected=true"
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            ./scripts/ci/detect_template_changes.sh
          fi

      - name: Stop if no template changes
        if: steps.changes.outputs.changes_detected == 'false'
        run: echo "No changes under templates/ — skipping."

      - name: Generate registry.json
        if: steps.changes.outputs.changes_detected == 'true'
        id: registry
        run: ./scripts/ci/generate_registry.sh

      - name: Create Pull Request
        if: steps.registry.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update registry.json"
          title: "Update registry.json"
          body: "Automated update of template registry."
          branch: "bot/update-registry"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          labels: "automation"
